# 스레드 장기 토큰은 60일이면 만료된다. 매주 갱신해서 시크릿에 다시 넣는다.
# GH_PAT 시크릿(이 저장소 Secrets 읽기·쓰기 권한의 fine-grained 토큰)이 있어야 동작한다.
name: refresh-token

on:
  schedule:
    - cron: "0 18 * * 0"   # 매주 월요일 03:00 KST
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 토큰 갱신
        env:
          TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::THREADS_ACCESS_TOKEN 없음"; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then echo "::error::GH_PAT 없음 — 토큰을 자동 갱신할 수 없습니다"; exit 1; fi
          NEW=$(curl -sf "https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token&access_token=$TOKEN" \
                | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          if [ -z "$NEW" ]; then echo "::error::토큰 갱신 실패"; exit 1; fi
          echo "::add-mask::$NEW"
          gh secret set THREADS_ACCESS_TOKEN --body "$NEW" --repo "${{ github.repository }}"
          echo "스레드 갱신 완료"

      - name: 인스타 토큰 갱신
        env:
          TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$TOKEN" ]; then echo "INSTAGRAM_ACCESS_TOKEN 없음 — 건너뜀"; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then echo "::error::GH_PAT 없음 — 토큰을 자동 갱신할 수 없습니다"; exit 1; fi
          NEW=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$TOKEN" \
                | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          if [ -z "$NEW" ]; then echo "::error::인스타 토큰 갱신 실패"; exit 1; fi
          echo "::add-mask::$NEW"
          gh secret set INSTAGRAM_ACCESS_TOKEN --body "$NEW" --repo "${{ github.repository }}"
          echo "인스타 갱신 완료"
