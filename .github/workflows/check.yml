# 점검용. 토큰이 맞게 들어갔는지(연결된 계정 이름만 출력)와
# 클라우드에서 카드 렌더링이 되는지 확인한다. 아무것도 게시하지 않는다.
name: check

on:
  push:
    paths:
      - ".github/workflows/check.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # 미디어 보관소 업로드 시험

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 스레드 토큰 장기 교환 (필요할 때만)
        env:
          TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$APP_SECRET" ]; then echo "THREADS_APP_SECRET 없음 — 교환 생략"; exit 0; fi
          RES=$(curl -s "https://graph.threads.net/access_token?grant_type=th_exchange_token&client_secret=$APP_SECRET&access_token=$TOKEN")
          NEW=$(echo "$RES" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null)
          DAYS=$(echo "$RES" | python3 -c "import sys,json; print(int(json.load(sys.stdin).get('expires_in',0))//86400)" 2>/dev/null)
          if [ -n "$NEW" ] && [ "$NEW" != "$TOKEN" ]; then
            echo "::add-mask::$NEW"
            gh secret set THREADS_ACCESS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
            echo "스레드 토큰을 장기 토큰(${DAYS}일)으로 바꿔 저장했습니다"
          else
            echo "교환 안 함: $(echo "$RES" | python3 -c "import sys,json; print(json.load(sys.stdin).get('error',{}).get('message','이미 장기 토큰'))" 2>/dev/null)"
          fi

      - name: 토큰 확인
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python - <<'EOF'
          import json, os, sys, urllib.error, urllib.parse, urllib.request
          uid, tok = os.environ["THREADS_USER_ID"], os.environ["THREADS_ACCESS_TOKEN"]
          print("THREADS_ACCESS_TOKEN:", "있음" if tok else "없음")
          print("THREADS_USER_ID     :", "있음" if uid else "없음 (선택 — 토큰으로 자동 조회)")
          print("GH_PAT (자동 갱신)   :", "있음" if os.environ["GH_PAT"] else "없음 — 60일마다 토큰 수동 교체 필요")
          if not tok:
              sys.exit(1)
          def get(path, **q):
              q["access_token"] = tok
              url = "https://graph.threads.net/v1.0/%s?%s" % (path, urllib.parse.urlencode(q))
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as ex:
                  try:
                      msg = json.loads(ex.read())["error"]["message"]
                  except Exception:
                      msg = "HTTP %d" % ex.code
                  print("오류:", msg)
                  sys.exit(1)
          me = get("me", fields="id,username")
          print("연결된 계정        : @%s" % me.get("username"))
          if uid and me.get("id") != uid:
              print("USER_ID 불일치 — THREADS_USER_ID 시크릿을 지우거나 %s 로 바꾸세요" % me.get("id"))
              sys.exit(1)
          lim = get("%s/threads_publishing_limit" % me["id"], fields="quota_usage,config")
          d = (lim.get("data") or [{}])[0]
          print("게시 권한          : 확인됨 (오늘 %s / %s건 사용)" % (d.get("quota_usage"), (d.get("config") or {}).get("quota_total")))
          EOF

      - name: 인스타 토큰 확인
        env:
          TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python - <<'EOF'
          import json, os, sys, urllib.error, urllib.parse, urllib.request
          tok = os.environ["TOKEN"]
          if not tok:
              print("INSTAGRAM_ACCESS_TOKEN: 없음 — 인스타 게시는 꺼진 상태"); sys.exit(0)
          def get(path, **q):
              q["access_token"] = tok
              url = "https://graph.instagram.com/%s?%s" % (path, urllib.parse.urlencode(q))
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as ex:
                  try:
                      msg = json.loads(ex.read())["error"]["message"]
                  except Exception:
                      msg = "HTTP %d" % ex.code
                  print("오류:", msg); sys.exit(1)
          me = get("me", fields="user_id,username,account_type")
          print("연결된 인스타 계정 : @%s (%s)" % (me.get("username"), me.get("account_type")))
          uid = me.get("user_id") or me.get("id")
          lim = get("%s/content_publishing_limit" % uid, fields="quota_usage,config")
          d = (lim.get("data") or [{}])[0]
          print("게시 권한          : 확인됨 (오늘 %s / %s건 사용)" % (d.get("quota_usage"), (d.get("config") or {}).get("quota_total")))
          EOF

      - name: Gemini 판정 시험 (게시 안 함)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'EOF'
          import json, os, sys
          from datetime import datetime, timezone
          import news_watch as n
          if not os.environ.get("GEMINI_API_KEY"):
              print("GEMINI_API_KEY 없음"); sys.exit(1)
          # 2026-09-27 실제 구글 뉴스 묶음 (헤드라인·매체만)
          c = {"id": "sample", "title": "sample", "pub": datetime(2026, 9, 27, 8, 0, tzinfo=timezone.utc),
               "sources": ["Al Jazeera", "BBC", "CBS News", "Reuters", "kare11.com"],
               "related": [
                   ("At least 27 people killed in 2 mass shootings in South Africa's Johannesburg, Capetown", "CBS News"),
                   ("South Africa police hunt suspects after 27 killed in two separate shootings", "Reuters"),
                   ("Two mass shootings in South Africa leave 27 dead", "BBC"),
                   ("At least 27 people killed in two shootings in South African townships", "Al Jazeera"),
                   ("Two separate mass shootings in different townships in South Africa leave at least 27 people dead", "kare11.com"),
                   ("South African police hunt killers after 27 gunned down in two separate shootings", "Reuters")]}
          evs = n.judge([c], [])
          ev = evs[0]
          print("팩트체크 전 본문:", ev["caption_ko"])
          ev = n.verify(ev, c)
          print("판정      :", ev["decision"], ev["skip_reason"])
          print("제목      :", ev["headline_ko"].replace("\n", " / "))
          print("요약      :", ev["sub_ko"])
          print("칩        :", ev["chips"])
          print("확인됨    :", ev["confirmed"])
          print("미확인    :", ev["unconfirmed"])
          print("본문      :\n" + ev["caption_ko"])
          ok, bad = n.numbers_ok(ev, c)
          print("숫자 검증 :", "통과" if ok else "거부 %s" % bad)
          EOF

      - name: 렌더링 확인
        run: |
          pip install --quiet pillow
          python make_cards.py specs/sample-newcaledonia-m66.json
          python -c "from PIL import Image; import glob; fs=sorted(glob.glob('output/2026-09-26-newcaledonia-m66/*.png')); print([Image.open(f).size for f in fs])"

      # 숏폼: 클라우드에서 렌더링 → 미디어 보관소 업로드 → 인스타가 릴스로 받아들이는지
      # (릴스 컨테이너만 만들고 media_publish 는 부르지 않는다 — 게시되지 않고 24시간 뒤 사라진다)
      - name: 숏폼 파이프라인 시험 (게시 안 함)
        env:
          MEDIA_BASE: https://news-factory-watch.alsgur3319.workers.dev/media
          TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
          pip install --quiet edge-tts
          python make_video.py specs/sample-newcaledonia-m66.json
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,sample_rate -of compact output/2026-09-26-newcaledonia-m66/video.mp4
          python - <<'EOF'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          import upload_media as u
          key = "_check/%s.mp4" % os.environ["GITHUB_RUN_ID"]
          print("업로드   :", u.put(key, "output/2026-09-26-newcaledonia-m66/video.mp4", u.oidc_token()))
          time.sleep(20)
          url = os.environ["MEDIA_BASE"] + "/" + key
          with urllib.request.urlopen(urllib.request.Request(url, method="HEAD")) as r:
              print("보관소   :", r.status, r.headers["Content-Type"], r.headers["Content-Length"], "bytes")
          t = os.environ.get("TOKEN")
          if not t:
              raise SystemExit("INSTAGRAM_ACCESS_TOKEN 없음 — 릴스 시험 생략")
          def ig(method, path, **p):
              p["access_token"] = t
              data = urllib.parse.urlencode(p).encode() if method == "POST" else None
              q = "" if data else "?" + urllib.parse.urlencode(p)
              try:
                  with urllib.request.urlopen(urllib.request.Request(
                          "https://graph.instagram.com/" + path + q, data=data, method=method), timeout=60) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as ex:
                  raise SystemExit("인스타 오류: %s" % json.loads(ex.read()).get("error", {}).get("message"))
          me = ig("GET", "me", fields="user_id")
          c = ig("POST", "%s/media" % (me.get("user_id") or me["id"]), media_type="REELS",
                 video_url=url, caption="check")["id"]
          st = {}
          for _ in range(40):
              st = ig("GET", c, fields="status_code,status")
              if st.get("status_code") in ("FINISHED", "ERROR", "EXPIRED"):
                  break
              time.sleep(6)
          print("인스타 릴스:", st.get("status_code"), st.get("status", ""), "(게시 안 함)")
          if st.get("status_code") != "FINISHED":
              raise SystemExit(1)
          EOF
