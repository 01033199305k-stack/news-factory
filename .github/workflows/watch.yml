# 새 속보가 있으면 카드를 만들어 스레드에 올리고, 45초 숏폼을 만들어 인스타 릴스로 올린다.
# 주로 Cloudflare 감시기(worker/)가 1분마다 보다가 새 후보가 생기면 workflow_dispatch 로 깨우고,
# 매시 5분(UTC)에는 fill=true 로 깨워 '정시 정리'(시간당 최소 1건)를 확인시킨다.
# 아래 schedule 은 감시기가 멈췄을 때를 위한 백업이다 (GitHub 예약 실행은 제때 안 돈다).
name: watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      fill:
        description: "1시간 동안 게시가 없으면 주요 뉴스 1건을 [정리]로 올린다"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write   # 미디어 보관소(감시기) 업로드 인증 — 따로 넣을 비밀값 없음

concurrency:
  group: watch
  cancel-in-progress: false

env:
  MEDIA_BASE: https://news-factory-watch.alsgur3319.workers.dev/media
  # post.py 는 토큰이 보이는 플랫폼을 모두 끝내야 항목을 닫는다 — 그래서 모든 게시 단계가 유튜브·틱톡 토큰을 봐야 한다
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  # 틱톡은 Buffer(무료 플랜) API 로 올린다. 키가 없으면 틱톡은 건너뛴다. 채널 ID 는 비밀이 아니라 여기 둔다
  BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
  BUFFER_TIKTOK_CHANNEL_ID: 6abd474aea19ca0bde360a50

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # workflow_dispatch 는 '깨운 순간'의 커밋을 체크아웃한다. 앞 실행이 끝나길 기다린 실행이 그 커밋을 쓰면
      # 앞 실행이 올린 기록을 못 보고 같은 뉴스를 다시 올린다 (2026-09-27 네팔·태국 중복 게시) → 항상 최신 main
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow anthropic edge-tts playwright   # playwright: 모션 영상 촬영 (크롬은 러너에 있는 것)

      # 대시보드에서 받은 스레드 토큰이 1시간짜리 단기 토큰이면 60일짜리로 바꿔 시크릿에 다시 넣는다.
      # 이미 장기 토큰이면 교환이 거절되고 아무 일도 안 일어난다. (THREADS_APP_SECRET·GH_PAT 필요)
      - name: 스레드 토큰 장기 교환 (필요할 때만)
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$APP_SECRET" ] || [ -z "$GH_TOKEN" ]; then exit 0; fi
          NEW=$(curl -s "https://graph.threads.net/access_token?grant_type=th_exchange_token&client_secret=$APP_SECRET&access_token=$TOKEN" \
                | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null)
          if [ -n "$NEW" ] && [ "$NEW" != "$TOKEN" ]; then
            echo "::add-mask::$NEW"
            gh secret set THREADS_ACCESS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
            echo "스레드 토큰을 60일짜리로 바꿔 저장했습니다 (다음 실행부터 적용)"
          else
            echo "교환할 필요 없음 (이미 장기 토큰이거나 토큰이 만료됨)"
          fi

      - name: 지진 감시 (USGS)
        continue-on-error: true
        run: |
          cp state/review.json /tmp/review_before.json 2>/dev/null || echo "[]" > /tmp/review_before.json
          python watch_usgs.py --queue

      # 속보: 여러 해외 매체가 동시에 보도한 사건·사고. 정시(감시기가 fill 로 깨움, 또는 백업 예약)에는
      # 1시간 동안 게시가 없었으면 주요 뉴스 1건을 [정리]로 올린다
      - name: 사건·사고 감시 (뉴스)
        continue-on-error: true   # 여기서 실패해도 지진 속보 게시는 계속
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # 무료 구간 (우선)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 유료, 선택
          FILL: ${{ (github.event_name == 'schedule' || github.event.inputs.fill == 'true') && '--fill' || '' }}
        run: python news_watch.py --queue $FILL

      - name: 대기열 확인
        id: q
        run: |
          python -c "import json,os; q=json.load(open('state/queue.json')) if os.path.exists('state/queue.json') else []; print('n=%d' % len(q))" >> "$GITHUB_OUTPUT"

      # 스레드는 카드가 나오자마자 — 영상 렌더링을 기다리지 않는다
      - name: 카드 올리기 + 스레드 게시
        if: steps.q.outputs.n != '0'
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python upload_media.py
          python post.py --only threads

      - name: 숏폼 영상 만들기 (45초, 여자 아나운서)
        if: steps.q.outputs.n != '0'
        continue-on-error: true   # 영상이 실패하면 인스타는 카드 캐러셀로 간다
        env:
          # 장면 배경 자료 화면 (Pixabay 우선, 없으면 Pexels, 둘 다 없으면 위키미디어 커먼즈 현지 사진·지구본만)
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          # 영상이 필요한 항목이 있을 때만 (앞 단계 업로드가 '영상 없음'을 표시했을 수도 있어서 여기서 다시 본다)
          if python -c "import json,sys; q=json.load(open('state/queue.json')); sys.exit(0 if any('video' not in i for i in q) else 1)"; then
            command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
            python make_video.py --queue
          fi

      - name: 영상 올리기 + 인스타 릴스 게시
        if: steps.q.outputs.n != '0'
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python upload_media.py
          python post.py --only instagram

      # 유튜브 쇼츠는 인스타와 같은 영상. 무료 한도(하루 약 6건)를 넘으면 그 건은 건너뛴다
      - name: 유튜브 쇼츠 게시
        if: steps.q.outputs.n != '0'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 제목·설명 번역 (무료)
          # 게시 토큰이 없으면 그 플랫폼은 끝난 걸로 보고 대기열에서 빼 버린다 — 스레드 재시도가 사라지지 않게 같이 넘긴다
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python post.py --only youtube

      # 틱톡도 같은 영상. Buffer 가 틱톡에 올리는 데 1~2분 걸려서 건당 2~3분 기다린다. 하루 한도를 넘으면 그 건은 건너뛴다
      - name: 틱톡 게시 (Buffer)
        if: steps.q.outputs.n != '0'
        continue-on-error: true
        env:
          # 게시 토큰이 없으면 그 플랫폼은 끝난 걸로 보고 대기열에서 빼 버린다 — 스레드·인스타 재시도가 사라지지 않게 같이 넘긴다
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python post.py --only tiktok

      # 카드·영상은 보관소에만 두고 저장소에는 기록(state·specs)만 남긴다 — 저장소가 불어나지 않게
      - name: 기록 커밋
        if: always()
        run: |
          git config user.name "news-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state specs
          if ! git diff --cached --quiet; then
            git commit -m "run: $(date -u +%Y-%m-%dT%H:%MZ)"
            # 실행은 한 번에 하나라 보통 충돌이 없지만, 밀려나면 몇 번 다시 시도한다
            for i in 1 2 3; do
              git pull --rebase -q && git push && exit 0
              git rebase --abort 2>/dev/null; sleep 5
            done
            exit 1
          fi

      # 지명 사전에 없는 지역이라 자동 게시를 멈춘 초안이 이번에 새로 생겼으면 실패 처리 → GitHub 가 메일로 알려준다
      - name: 검토 필요 알림
        run: |
          if ! cmp -s /tmp/review_before.json state/review.json 2>/dev/null && [ -f state/review.json ]; then
            echo "::error::지명 번역 확인이 필요한 초안이 생겼습니다. state/review.json 을 확인하세요."
            exit 1
          fi
